name: Render Backend Daytime Keepalive

# This workflow keeps the Render free tier backend awake during normal daytime usage hours.
# 
# Schedule:
# - Starts at 07:00 AM IST (Indian Standard Time, Asia/Kolkata).
# - Runs approximately every 10 minutes throughout the day.
# - Stops at 12:00 Midnight IST.
# - Allows the Render backend to remain idle and sleep overnight (00:01 - 06:59 IST)
#   to conserve Render free tier monthly instance hours (~527 hours/month vs 750h limit).
#
# Time conversion:
# - IST is UTC+05:30.
# - 07:00 AM IST = 01:30 AM UTC.
# - 12:00 Midnight IST = 18:30 (6:30 PM) UTC.
#
# Note on GitHub Actions cron:
# GitHub Actions scheduled workflows run on shared runners and may experience minor
# delays or jitter depending on GitHub platform queue load. Exact execution times are
# not guaranteed by GitHub. A runtime gatekeeper step verifies the IST time window.

on:
  schedule:
    # 01:30, 01:40, 01:50 UTC (07:00, 07:10, 07:20 IST)
    - cron: '30,40,50 1 * * *'
    # Every 10 mins from 02:00 to 17:50 UTC (07:30 to 23:20 IST)
    - cron: '*/10 2-17 * * *'
    # 18:00, 18:10, 18:20, 18:30 UTC (23:30, 23:40, 23:50, 00:00 IST)
    - cron: '0,10,20,30 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force health check regardless of overnight idle window'
        required: false
        default: true
        type: boolean

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  health-check:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Daytime Active Window Gatekeeper (IST)
        id: gatekeeper
        run: |
          UTC_NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          IST_NOW=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          IST_HOUR=$(TZ='Asia/Kolkata' date '+%-H')
          IST_MIN=$(TZ='Asia/Kolkata' date '+%-M')

          echo "Current UTC Time : $UTC_NOW"
          echo "Current IST Time : $IST_NOW"
          echo "Trigger Source   : ${{ github.event_name }}"

          # Boundary logic:
          # Active window: 07:00 IST to 24:00 (00:00 midnight) IST.
          # Overnight idle period: 00:01 IST to 06:59 IST.
          # - Hours 1..6: overnight idle.
          # - Hour 0 with minutes > 0: overnight idle (e.g. 00:10 IST).
          # - Hour 0 with minute 0: exactly midnight (allowed final ping).
          # - Hours 7..23: daytime active window (allowed).

          IS_OVERNIGHT=0
          if [ "$IST_HOUR" -ge 1 ] && [ "$IST_HOUR" -le 6 ]; then
            IS_OVERNIGHT=1
          elif [ "$IST_HOUR" -eq 0 ] && [ "$IST_MIN" -gt 0 ]; then
            IS_OVERNIGHT=1
          fi

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$IS_OVERNIGHT" -eq 1 ]; then
            echo "::notice ::Overnight idle window active (00:01 - 06:59 IST). Skipping health check to allow Render backend to sleep and conserve free instance hours."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Daytime window confirmed (or manual dispatch). Proceeding with health check."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request /api/health
        if: steps.gatekeeper.outputs.should_run == 'true'
        run: |
          TARGET_URL="https://voco-backend.onrender.com/api/health"
          echo "Target Endpoint: $TARGET_URL"
          echo "Request Time: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"

          # Perform curl with 45s timeout and capture status code, total time, and body
          HTTP_RESPONSE=$(curl -s -S -w "\n%{http_code}\n%{time_total}" --max-time 45 "$TARGET_URL" || echo -e "\n000\n0")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d' | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 2 | head -n 1)
          TOTAL_TIME=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "──────────────────────────────────────────────"
          echo "HTTP Status Code : $HTTP_STATUS"
          echo "Response Time    : ${TOTAL_TIME}s"
          echo "Response Body    : $HTTP_BODY"
          echo "──────────────────────────────────────────────"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Result: Backend is healthy and available."
          elif [ "$HTTP_STATUS" = "502" ] || [ "$HTTP_STATUS" = "503" ] || [ "$HTTP_STATUS" = "504" ]; then
            echo "⏳ Result: Backend is waking up (HTTP $HTTP_STATUS). Container received wakeup traffic."
          elif [ "$HTTP_STATUS" = "000" ] || [ "$HTTP_STATUS" = "0" ]; then
            echo "⚠️ Result: Request timed out or network failed after 45s."
          else
            echo "ℹ️ Result: Backend returned HTTP $HTTP_STATUS"
          fi

